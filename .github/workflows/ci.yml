name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: |
          node --check lib/index.js
          node --check resources/bin/check-standards.mjs
      - name: Structure and scanner tests
        run: |
          node test/plugin.test.mjs
          node test/standards.test.mjs
      - name: Self-scan (exclude intentional fixtures)
        run: node resources/bin/check-standards.mjs --path . --exclude fixtures --fail-on p1
